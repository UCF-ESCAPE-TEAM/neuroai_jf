# emg/pose test set restricted to the held-out-user scenario (emg2pose Table 4,
# "user" column): recordings from users unseen in training performing stages
# that were seen. Train and val are unchanged from config.yaml; only the
# QueryEvents filter that selects the test scenario is overridden.
data:
  study:
    keep_held_out_user_stage_test:
      query: "split != 'test' or generalization == 'user'"
